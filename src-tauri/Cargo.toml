[package]
name = "voxleaf"
description = "VoxLeaf — a self-contained reading and listening library"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["VoxLeaf contributors"]

[lib]
name = "voxleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
voxleaf-core = { path = "../crates/voxleaf-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
axum = "0.8"
tower = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
base64.workspace = true
rand.workspace = true
