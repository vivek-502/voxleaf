<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VoiceBook">
  <title>VoiceBook</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171F" />
      <stop offset="1" stop-color="#0B0B0F" />
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)" />

  <!-- Waveform: five bars centred on the optical middle of the tile. -->
  <g fill="url(#wave)">
    <rect x="7.5" y="13" width="2.75" height="6" rx="1.375" />
    <rect x="12.125" y="9.5" width="2.75" height="13" rx="1.375" />
    <rect x="16.75" y="6.5" width="2.75" height="19" rx="1.375" />
    <rect x="21.375" y="11" width="2.75" height="10" rx="1.375" />
    <rect x="26" y="14.5" width="2.75" height="3" rx="1.375" />
  </g>
</svg>
