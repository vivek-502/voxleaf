[workspace]
resolver = "2"
members = ["src-tauri", "crates/voxleaf-core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
bytes = "1"
rand = "0.9"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
chrono = "0.4"
futures-util = "0.3"
urlencoding = "2"

# The whole profile is tuned for a desktop app people actually launch: the DB
# crate is compiled with opt-level 3 because rusqlite/sqlite see the real work
# (index builds, rollups), and the dev profile keeps build times livable.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
